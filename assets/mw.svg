<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Mary G. Wilson">
  <!-- One solid mark that still reads at 16px. Black on light browser chrome, white
       on dark, so the tab icon never disappears into its own background. The disc
       sits at 62% of the canvas - full bleed reads as a cramped block in a tab. -->
  <style>
    .mark { fill: #000000; }
    @media (prefers-color-scheme: dark) { .mark { fill: #ffffff; } }
  </style>
  <circle class="mark" cx="24" cy="24" r="15"/>
</svg>
